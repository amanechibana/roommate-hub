name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mock.example.test
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: mock
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:sql
        env:
          SQL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/reliability.spec.ts tests/browser/bill-reconciliation.spec.ts tests/browser/household-life.spec.ts tests/browser/coordination.spec.ts --workers=1
        env:
          PW_MANAGED_SERVER: "1"
          PW_BASE_URL: http://127.0.0.1:3001
          PW_SHARED_API: "1"
          PW_BROWSER_CHANNEL: chromium
